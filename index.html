<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hiphopstore.de — Domain For Sale</title>
<meta name="description" content="The premium domain hiphopstore.de is for sale. A short, memorable .de name for a hip-hop shop, label, or marketplace. Contact the owner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b0910;
    --bg-1:#15111d;
    --bg-2:#1e1a29;
    --line:rgba(243,196,78,.18);
    --gold:#f3c44e;
    --gold-deep:#e0a626;
    --gold-light:#ffe9a8;
    --text:#f5f4f8;
    --muted:#a49dae;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 700px at 50% -8%, #2a2333 0%, rgba(42,35,51,0) 60%),
      radial-gradient(900px 900px at 50% 118%, #1b1526 0%, rgba(27,21,38,0) 55%),
      var(--bg-0);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    position:relative;
    overflow-x:hidden;
  }
  /* faint concentric vinyl motifs, corners */
  body::before,body::after{
    content:"";
    position:fixed;
    width:340px;height:340px;
    border-radius:50%;
    background:
      radial-gradient(circle, transparent 0 34%, var(--line) 34% 35%, transparent 35% 49%, var(--line) 49% 50%, transparent 50% 64%, var(--line) 64% 65%, transparent 65% 79%, var(--line) 79% 80%, transparent 80%);
    z-index:0;pointer-events:none;
  }
  body::before{top:-90px;right:-90px}
  body::after{bottom:-110px;left:-110px}

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo{
    width:auto;
    height:clamp(210px,34vh,300px);
    max-width:82%;
    object-fit:contain;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.55));
  }

  .eyebrow{
    margin-top:6px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .status{
    margin-top:22px;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 18px;
    border:1px solid var(--line);
    border-radius:999px;
    background:linear-gradient(180deg, rgba(243,196,78,.10), rgba(243,196,78,.03));
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold-light);
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 0 rgba(243,196,78,.55);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(243,196,78,.5)}
    70%{box-shadow:0 0 0 10px rgba(243,196,78,0)}
    100%{box-shadow:0 0 0 0 rgba(243,196,78,0)}
  }

  h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    margin-top:20px;
    font-size:clamp(38px,7vw,62px);
    line-height:1.02;
    letter-spacing:.01em;
    text-transform:uppercase;
  }
  h1 .accent{color:var(--gold)}

  .lede{
    margin-top:18px;
    max-width:460px;
    font-size:clamp(15px,2.4vw,17px);
    line-height:1.6;
    color:var(--muted);
  }

  /* signature: gold equalizer divider */
  .eq{
    margin:30px 0 6px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    height:34px;
  }
  .eq span{
    width:6px;
    border-radius:3px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));
    animation:bounce 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(1){height:40%;animation-delay:-.9s}
  .eq span:nth-child(2){height:78%;animation-delay:-.5s}
  .eq span:nth-child(3){height:55%;animation-delay:-.2s}
  .eq span:nth-child(4){height:100%;animation-delay:-.7s}
  .eq span:nth-child(5){height:62%;animation-delay:-.35s}
  .eq span:nth-child(6){height:85%;animation-delay:-.6s}
  .eq span:nth-child(7){height:45%;animation-delay:-.15s}
  @keyframes bounce{
    0%,100%{transform:scaleY(.45)}
    50%{transform:scaleY(1)}
  }

  .cta{
    margin-top:26px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 34px;
    border-radius:14px;
    background:linear-gradient(180deg,var(--gold-light) 0%,var(--gold) 42%,var(--gold-deep) 100%);
    color:#221803;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:.02em;
    text-decoration:none;
    border:1px solid #8a5d0a;
    box-shadow:0 10px 28px rgba(224,166,38,.28), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 36px rgba(224,166,38,.4), inset 0 1px 0 rgba(255,255,255,.6);
    filter:saturate(1.05);
  }
  .cta:active{transform:translateY(0)}
  .cta:focus-visible{outline:3px solid var(--gold-light);outline-offset:3px}
  .cta svg{width:19px;height:19px}

  .note{
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
  }
  .note a{color:var(--gold-light);text-decoration:none;border-bottom:1px solid rgba(255,233,168,.3)}
  .note a:hover{border-bottom-color:var(--gold-light)}

  footer{
    position:relative;
    z-index:1;
    margin-top:44px;
    font-size:12px;
    letter-spacing:.06em;
    color:rgba(164,157,174,.6);
  }

  @media (max-width:420px){
    .status{letter-spacing:.16em}
    .cta{width:100%;justify-content:center}
  }

  @media (prefers-reduced-motion:reduce){
    .eq span,.dot{animation:none}
    .eq span{transform:scaleY(.8)}
    .cta{transition:none}
  }
</style>
</head>
